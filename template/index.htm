<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Emotion Detection</title>
</head>
<body>
  <h1>Student Emotion Upload</h1>
  <p>Fill in your details and upload a photo (face visible).</p>

  <form method="post" action="/predict" enctype="multipart/form-data">
    <label for="surname">Surname:</label><br>
    <input type="text" id="surname" name="surname" required><br><br>

    <label for="firstname">Firstname:</label><br>
    <input type="text" id="firstname" name="firstname" required><br><br>

    <label for="matric_number">Matric Number:</label><br>
    <input type="text" id="matric_number" name="matric_number" required><br><br>

    <label for="email">Email (optional):</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="photo">Upload photo:</label><br>
    <input type="file" id="photo" name="photo" accept="image/*" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <hr>
  <p>Notes:</p>
  <ul>
    <li>Supported images: PNG, JPG, JPEG, GIF.</li>
    <li>Uploaded images are stored in <code>static/uploads/</code> and also saved into <code>database.db</code>.</li>
  </ul>
</body>
</html>
